<text x="56" y="536" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;&#160;&#160;for&#160;neighbor&#160;in&#160;graph[node]:</text>
<text x="56" y="557" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;dfs(neighbor,&#160;graph,&#160;visited)</text>
