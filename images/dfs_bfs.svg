<text x="44" y="718" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">Mark&#160;visited&#160;when&#160;you&#160;ENTER&#160;a&#160;node,&#160;before&#160;recursing</text>
