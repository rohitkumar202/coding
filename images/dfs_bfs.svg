<text x="728" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="start">0&#160;&#160;→&#160;&#160;1&#160;&#160;→&#160;&#160;2&#160;&#160;→&#160;&#160;3&#160;&#160;→&#160;&#160;4&#160;&#160;→&#160;&#160;5</text>
<rect x="630" y="428" width="530" height="236" rx="10" fill="#0f172a"/>
<text x="646" y="452" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">def&#160;bfs(queue,&#160;graph,&#160;visited):</text>
<rect x="630" y="458" width="530" height="21" fill="#7c2d12"/>
<rect x="630" y="458" width="4" height="21" fill="#ea580c"/>
<text x="646" y="473" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;queue&#160;=&#160;deque(queue)</text>
<text x="646" y="494" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;visited.update(queue)</text>
<text x="646" y="515" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;while&#160;queue:</text>
<text x="646" y="536" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;&#160;&#160;node&#160;=&#160;queue.popleft()</text>
<text x="646" y="557" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;&#160;&#160;print(node)</text>
<text x="646" y="578" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;&#160;&#160;for&#160;neighbor&#160;in&#160;graph[node]:</text>
<rect x="630" y="584" width="530" height="21" fill="#7c2d12"/>
<rect x="630" y="584" width="4" height="21" fill="#ea580c"/>
<text x="646" y="599" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;if&#160;neighbor&#160;not&#160;in&#160;visited:</text>
<rect x="630" y="605" width="530" height="21" fill="#7c2d12"/>
<rect x="630" y="605" width="4" height="21" fill="#ea580c"/>
<text x="646" y="620" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;visited.add(neighbor)&#160;&#160;#&#160;mark&#160;on&#160;enqueue</text>
<text x="646" y="641" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" font-weight="normal" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;queue.append(neighbor)</text>
<text x="634" y="694" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ea580c" font-weight="bold" text-anchor="start">Remember</text>
<text x="634" y="718" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">Mark&#160;visited&#160;when&#160;you&#160;ENQUEUE,&#160;not&#160;when&#160;you&#160;pop,</text>
<text x="634" y="740" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">so&#160;each&#160;node&#160;enters&#160;the&#160;queue&#160;only&#160;once.</text>
<text x="634" y="762" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">deque.popleft()&#160;is&#160;O(1);&#160;list.pop(0)&#160;is&#160;O(n).</text>
<text x="600.0" y="818" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="middle">graph:&#160;&#160;0→[1,&#160;2]&#160;&#160;&#160;1→[3,&#160;4]&#160;&#160;&#160;2→[4]&#160;&#160;&#160;3→[5]&#160;&#160;&#160;4→[5]&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Both&#160;run&#160;in&#160;O(V&#160;+&#160;E)&#160;&#160;&#160;&#160;·&#160;&#160;&#160;&#160;badge&#160;=&#160;visit&#160;order</text>
</svg>
